[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-monitor"
version = "0.1.0"
description = "An all-in-one multi-GPU, RAM, and CPU resource monitor (NVTOP-style)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.65",
    "psutil>=5.9",
]

[project.scripts]
athena = "athena.main:main"

[tool.setuptools]
packages = ["athena", "athena.core", "athena.ui"]
